<!DOCTYPE html>
<html lang="en" class="seasonal" data-theme="spring">
<head>
  <meta charset="UTF-8" />
  <title>TidyStack</title>
  <link rel="stylesheet" href="popup.css" />
  <link rel="stylesheet" href="world.css" />
</head>
<body>
  <div class="app">
    <header class="header">
      <div class="scene" id="scene" aria-hidden="true"></div>
      <h1 class="title">TidyStack</h1>
    </header>

    <div class="fan-row" id="fanRow"></div>

    <nav class="tabs-nav" id="tabsNav">
      <button class="tab-btn active" data-tab="overview"><i class="pix" data-icon="window" aria-hidden="true"></i>Overview</button>
      <button class="tab-btn" data-tab="duplicates"><i class="pix" data-icon="copy" aria-hidden="true"></i>Duplicates</button>
      <button class="tab-btn" data-tab="graveyard"><i class="pix" data-icon="grave" aria-hidden="true"></i>Graveyard</button>
      <button class="tab-btn" data-tab="settings"><i class="pix" data-icon="gear" aria-hidden="true"></i>Settings</button>
    </nav>

    <main id="panels">
      <section class="panel" data-panel="overview"></section>
      <section class="panel hidden" data-panel="duplicates"></section>
      <section class="panel hidden" data-panel="graveyard"></section>
      <section class="panel hidden" data-panel="settings"></section>
    </main>

    <div class="spacer"></div>
  </div>

  <div class="undo-toast hidden" id="undoToast" role="status" aria-live="polite">
    <i class="t-pip" id="toastPip" aria-hidden="true"></i>
    <span id="undoMessage"></span>
    <button id="undoBtn">Undo</button>
  </div>

  <script src="pixel.js"></script>
  <script src="themes.js"></script>
  <script src="critter.js"></script>
  <script src="popup.js"></script>
</body>
</html>
